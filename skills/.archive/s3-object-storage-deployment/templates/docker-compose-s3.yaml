# S3 Deployment Templates

## MinIO (Optimized)
```yaml
services:
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_BROWSER: off
      MINIO_CI_CD: true
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
```

## Garage (Ultra-light)
```yaml
services:
  garage:
    image: docker.io/garage/garage:latest
    ports:
      - "3900:3900"
    volumes:
      - garage_data:/var/lib/garage
      - ./garage.toml:/etc/garage.toml
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
```

## SeaweedFS (Mini Mode)
```yaml
services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.port=8333 -dir=/data
    ports:
      - "8333:8333"
    volumes:
      - seaweed_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
```
