# Hyprland window rules for Hermes floating desktop client
# Source this from ~/.config/hypr/hyprland.conf:
#   source = ~/hermes-chat/hyprland.conf

windowrulev2 = float, title:^(Viernes Chat)$
windowrulev2 = noborder, title:^(Viernes Chat)$
windowrulev2 = noinitialfocus, title:^(Viernes Chat)$
windowrulev2 = dimaround, title:^(Viernes Chat)$
windowrulev2 = center(1), title:^(Viernes Chat)$

# Keybind: Super+Space to toggle the assistant window
bind = SUPER, SPACE, exec, ~/hermes-chat/toggle.sh
